# nginx-gateway - single entry point of the Compose stack.  DEV topology: plain HTTP, no TLS, no auth.
# Production TLS 1.3 / mTLS (docs/ARCHITECTURE.md) is a design intention that is NOT configured here.
#
# Routing rule of thumb:  /api/v1/<area>/...  keeps its path and goes to the owning service.
#   area            owner service            notes
#   qr, auth        user-qr-service          Khoa
#   kiosk           user-qr-service          /api/v1/kiosk/whitelist (kiosk-authenticated, Khoa + Khanh)
#   gates           gate-station-service     Khoi
#   attendance      attendance-processor     Khoi (501 until the authenticated path exists)
#   reports         reporting-service        Nam
# Extra, DEV ONLY and unauthenticated:  /api/dev/attendance/*, /api/dev/kiosk/*, /api/local/*
# Health probes:  /services/<name>/health  -> that service's real readiness endpoint.
#
# Upstreams are resolved per request through Docker's DNS (127.0.0.11) because proxy_pass uses a variable. The
# gateway therefore starts even if a service is not up yet, and answers 502 for it instead of refusing to boot.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;

    # Reuse a caller-supplied request id, otherwise mint one; services echo it as `correlationId` in errors.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    server {
        listen 80;

        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $req_id;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Request-Id $req_id always;

        error_page 502 = @bad_gateway;
        error_page 504 = @gateway_timeout;

        location @bad_gateway {
            default_type application/json;
            return 502 '{"code":"UPSTREAM_UNAVAILABLE","message":"the upstream service is not reachable"}';
        }
        location @gateway_timeout {
            default_type application/json;
            return 504 '{"code":"UPSTREAM_TIMEOUT","message":"the upstream service did not answer in time"}';
        }

        # ------------------------------------------------------------------ gateway + health probes
        location = /gateway/health {
            default_type application/json;
            return 200 '{"status":"UP","service":"nginx-gateway"}';
        }

        location = /services/user-qr/health {
            set $up user-qr-service:8080;
            rewrite ^ /actuator/health break;
            proxy_pass http://$up;
        }
        location = /services/gate-station/health {
            set $up gate-station-service:8080;
            rewrite ^ /actuator/health break;
            proxy_pass http://$up;
        }
        location = /services/attendance/health {
            set $up attendance-processor:8080;
            rewrite ^ /actuator/health break;
            proxy_pass http://$up;
        }
        location = /services/reporting/health {
            set $up reporting-service:8080;
            rewrite ^ /actuator/health break;
            proxy_pass http://$up;
        }
        location = /services/kiosk/health {
            set $up kiosk-agent:8080;
            rewrite ^ /actuator/health break;
            proxy_pass http://$up;
        }
        location = /services/mock-turnstile/health {
            set $up mock-turnstile-api:8090;
            rewrite ^ /health break;
            proxy_pass http://$up;
        }
        location = /services/mock-hr/health {
            set $up mock-hr-payroll-api:8091;
            rewrite ^ /health break;
            proxy_pass http://$up;
        }

        # Anything else under /services/ or /api/ is an honest 404. This also stops a request loop:
        # the web-frontend container proxies /api and /services back to this gateway.
        location /services/ {
            default_type application/json;
            return 404 '{"code":"NOT_FOUND","message":"unknown service probe"}';
        }
        location /api/ {
            default_type application/json;
            return 404 '{"code":"NOT_FOUND","message":"no gateway route for this path"}';
        }

        # ------------------------------------------------------------------ central APIs (docs/API-CONTRACTS.md)
        location /api/v1/qr/ {
            set $up user-qr-service:8080;
            proxy_pass http://$up;
        }
        location /api/v1/auth/ {
            set $up user-qr-service:8080;
            proxy_pass http://$up;
        }
        location /api/v1/kiosk/ {
            set $up user-qr-service:8080;
            proxy_pass http://$up;
        }
        location /api/v1/gates {
            set $up gate-station-service:8080;
            proxy_pass http://$up;
        }
        location /api/v1/attendance/ {
            set $up attendance-processor:8080;
            proxy_pass http://$up;
        }
        location /api/v1/reports/ {
            set $up reporting-service:8080;
            proxy_pass http://$up;
        }

        # ------------------------------------------------------------------ DEV ONLY (unauthenticated fixtures)
        location /api/dev/attendance/ {
            set $up attendance-processor:8080;
            proxy_pass http://$up;
        }
        location /api/dev/kiosk/ {
            set $up kiosk-agent:8080;
            proxy_pass http://$up;
        }
        # Kiosk simulator -> kiosk-agent (docs/API-CONTRACTS.md section 3). Trusted dev network only.
        location /api/local/ {
            set $up kiosk-agent:8080;
            proxy_pass http://$up;
        }

        # ------------------------------------------------------------------ frontend
        location / {
            set $up web-frontend:80;
            proxy_pass http://$up;
        }
    }
}
