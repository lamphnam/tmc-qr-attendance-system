# Serves the built React app and, so that http://localhost:3000 works on its own, forwards /api and /services to
# the gateway. The gateway answers 404 for unknown /api and /services paths, so this cannot loop.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    location /api/ {
        set $gw nginx-gateway:80;
        proxy_pass http://$gw;
    }
    location /services/ {
        set $gw nginx-gateway:80;
        proxy_pass http://$gw;
    }

    # SPA fallback for client-side routes such as /employee or /guard
    location / {
        try_files $uri $uri/ /index.html;
    }
}
